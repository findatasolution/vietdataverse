name: Fuel Pipeline

# ONE writer, one watchdog (restructured 2026-09-19).
#
# Before this, the model was recomputed in two places for the same data: the box
# (deploy/crawl-fuel.sh, only when a new cycle actually landed) and a `model` job
# here (every Thursday, whether anything had changed or not). On 2026-09-19 that
# produced two identical refits hours apart, and over its life it left 23 forecast
# runs and 22 backtest runs for roughly a dozen real price cycles — noise that
# makes "which run is current" harder to answer for no benefit.
#
# This repo already settled the same question for gold on 2026-09-14: "Two writers
# on the same rows bought nothing." So:
#   - The BOX owns fuel_price_cycle AND the model refit. It alone writes.
#   - THIS WORKFLOW crawls Yahoo (which answers GitHub fine, unlike moit.gov.vn),
#     triggers the box, and then CHECKS the result. It never refits the model.
# The check is the point: a crawl that writes nothing and exits 0 is the exact
# failure that kept the MOIT table frozen for two months while CI stayed green.

on:
  schedule:
    # Daily at 09:23 VN. Daily because fuel_world_daily is daily data and the MOIT
    # cadence has changed twice in 2026; :23 because GitHub drops scheduled runs on
    # congested round minutes (measured 2026-08-09: 4-8 of 9 daily runs fired, 32
    # min late on average). The previous '0 2 * * 4' broke that rule and was weekly.
    - cron: '23 2 * * *'
  workflow_dispatch:

jobs:
  world-crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-fuel.txt
      - name: Brent/RBOB futures -> Bronze/Silver
        # Exits non-zero if any instrument's newest row is more than
        # STALE_AFTER_DAYS old, so a silently frozen series turns this red.
        run: python crawl_tools/crawl_fuel_world.py
        env:
          FUEL_FORECAST_DB: ${{ secrets.FUEL_FORECAST_DB }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_RAW: ${{ secrets.R2_BUCKET_RAW }}

  moit-crawl-on-box:
    runs-on: ubuntu-latest
    steps:
      # moit.gov.vn refuses GitHub runners outright (RemoteDisconnected on the
      # search endpoint, SSLEOFError and "Network is unreachable" on the two
      # category pages, three runs on 2026-09-19 from a US runner IP). A crawl
      # step here could only ever conclude "no newer cycle" -- which is how the
      # 09-03, 09-10 and 09-17 cycles were all missed while this stayed green.
      # deploy/crawl-fuel.timer already runs daily on the box; this is the
      # backstop that turns the run red when that path stops working.
      - name: Skip if server secrets not configured
        id: guard
        run: echo "ready=${{ secrets.DEPLOY_HOST != '' }}" >> "$GITHUB_OUTPUT"
      - name: Trigger the box crawl (it refits the model itself if data moved)
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 25m
          script: |
            set -uo pipefail
            systemctl start --wait crawl-fuel.service || true
            journalctl -u crawl-fuel.service -n 40 --no-pager || true
            # The unit's own exit status decides this step: a stale or unparseable
            # crawl exits non-zero inside crawl_moit_fuel.py and must surface here.
            status=$(systemctl show crawl-fuel.service -p ExecMainStatus --value)
            echo "unit exit status: $status"
            [ "$status" = "0" ]

  freshness-check:
    # Runs even when a crawl job failed: the point is to report the state of the
    # data, and "the crawl failed AND the data is 3 weeks old" is the report worth
    # having. Deliberately not `needs`-gated on success.
    needs: [world-crawl, moit-crawl-on-box]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-fuel.txt
      - name: Is the served data actually current?
        run: python crawl_tools/check_fuel_freshness.py
        env:
          FUEL_FORECAST_DB: ${{ secrets.FUEL_FORECAST_DB }}
