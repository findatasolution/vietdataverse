# Install, run and inspect a box-side crawl unit on demand.
#
# The scheduled crawls live on the prod box, not on GitHub — gold/silver since
# 2026-09-14 (deploy/crawl-fallback.timer), MOIT fuel since 2026-09-19
# (deploy/crawl-fuel.timer). Both sources refuse GitHub's runners, so the box is
# the only place they can run; see CLAUDE.md. That left no way to trigger a run,
# install an edited unit, or read a log without SSH access to the box.
#
# This workflow closes that gap with the deploy key GitHub already holds: it
# copies the unit files from the box's checkout into systemd, enables the timer,
# runs the service synchronously and prints the journal. Installing is idempotent
# and is the step a deploy cannot do on its own (a deploy only lands files).
name: Box — run a crawl now

on:
  workflow_dispatch:
    inputs:
      unit:
        description: "Which crawl unit"
        required: true
        default: crawl-fuel
        type: choice
        options: [crawl-fuel, crawl-fallback]
      lines:
        description: "Journal lines to print"
        required: false
        default: "120"

jobs:
  run-on-box:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if server secrets not configured
        id: guard
        run: echo "ready=${{ secrets.DEPLOY_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Install unit, run it, print journal
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 25m
          script: |
            set -uo pipefail
            UNIT="${{ inputs.unit }}"
            APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            APP_DIR="${APP_DIR:-/root/vietdataverse}"

            echo "=== installing $UNIT from $APP_DIR/deploy ==="
            chmod +x "$APP_DIR/deploy/$UNIT.sh" || true
            cp "$APP_DIR/deploy/$UNIT.service" "$APP_DIR/deploy/$UNIT.timer" /etc/systemd/system/ || true
            systemctl daemon-reload || true
            systemctl enable --now "$UNIT.timer" || true

            echo
            echo "=== timer state ==="
            systemctl list-timers "$UNIT*" --all --no-pager || true

            echo
            echo "=== running $UNIT.service (synchronously) ==="
            # --wait blocks until the unit finishes, so the journal below is
            # complete rather than a snapshot of a still-running crawl.
            systemctl start --wait "$UNIT.service" || true

            echo
            echo "=== journal (last ${{ inputs.lines }} lines) ==="
            journalctl -u "$UNIT.service" -n ${{ inputs.lines }} --no-pager || true

            echo
            echo "=== unit result ==="
            systemctl show "$UNIT.service" \
                -p Result -p ExecMainStatus -p ActiveState --no-pager || true
