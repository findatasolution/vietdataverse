name: Deploy to Production

# Auto-deploy so prod is never stale again:
#   - on code push to main
#   - after "Generate Static Chart Data" commits fresh fe/data (those commits use
#     [skip ci], so a plain push trigger would miss them → use workflow_run)
#   - manual
#
# Target box migrated 2026-09-04: Hetzner (62.238.25.95, Germany) -> BKHOST
# Cloud VPS B (103.130.215.180, Vietnam/VNPT datacenter). Root cause: nso.gov.vn
# resets connections from foreign/EU datacenter IPs (both GitHub Actions runners
# and Hetzner itself), blocking the GSO crawlers; a VN-hosted box isn't blocked.
# mythreel.studio (the other app that shared the Hetzner box) was discontinued
# in the same move, so this box now runs VDV standalone with its own Caddy
# (docker-compose.override.yml on the box, not committed — see deploy/vietdataverse.caddy
# for the routing rules it uses). Secrets renamed HETZNER_* -> DEPLOY_* accordingly.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Generate Static Chart Data"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if server secrets not configured
        id: guard
        run: echo "ready=${{ secrets.DEPLOY_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            echo "Deployed $(git rev-parse --short HEAD)"

            # Keep the box's systemd units in step with the repo.
            #
            # Until 2026-09-14 a deploy only landed the *files* — installing them
            # under /etc/systemd/system and reloading was a manual step nobody
            # remembered. The result: the box kept running a crawl timer whose
            # schedule and skip-guard no longer matched deploy/crawl-fallback.*,
            # while CLAUDE.md and DEPLOY.md both claimed the timer wasn't even
            # provisioned here. That drift is what pinned the published gold price
            # to the morning quote for 75 days.
            #
            # cmp -s keeps this quiet and idempotent: daemon-reload and restart
            # only happen when a unit file actually changed.
            for unit in crawl-fallback.service crawl-fallback.timer; do
                [ -f "deploy/$unit" ] || continue
                if [ -L "/etc/systemd/system/$unit" ]; then
                    # Installed as a symlink into this checkout, so `git reset`
                    # above already changed its content — nothing to copy, but
                    # systemd still holds the old text until daemon-reload.
                    echo "systemd: $unit is a symlink -> $(readlink -f "/etc/systemd/system/$unit")"
                elif ! cmp -s "deploy/$unit" "/etc/systemd/system/$unit"; then
                    cp "deploy/$unit" "/etc/systemd/system/$unit"
                    echo "systemd: copied $unit"
                else
                    echo "systemd: $unit content already identical"
                fi
            done

            # Unconditional: cheap, idempotent, and the only way a symlinked unit
            # whose file changed under `git reset` actually reaches systemd. The
            # earlier "only reload when cmp differs" version silently skipped it.
            systemctl daemon-reload
            systemctl enable --now crawl-fallback.timer >/dev/null 2>&1 || true
            systemctl restart crawl-fallback.timer
            echo "systemd: state after reload ->"
            systemctl list-timers 'crawl-fallback*' --all --no-pager || true
            systemctl show crawl-fallback.timer -p TimersCalendar --no-pager || true
