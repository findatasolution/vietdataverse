name: Deploy to Production

# Auto-deploy so prod is never stale again:
#   - on code push to main
#   - after "Generate Static Chart Data" commits fresh fe/data (those commits use
#     [skip ci], so a plain push trigger would miss them → use workflow_run)
#   - manual
#
# Target box migrated 2026-09-04: Hetzner (62.238.25.95, Germany) -> BKHOST
# Cloud VPS B (103.130.215.180, Vietnam/VNPT datacenter). Root cause: nso.gov.vn
# resets connections from foreign/EU datacenter IPs (both GitHub Actions runners
# and Hetzner itself), blocking the GSO crawlers; a VN-hosted box isn't blocked.
# mythreel.studio (the other app that shared the Hetzner box) was discontinued
# in the same move, so this box now runs VDV standalone with its own Caddy
# (docker-compose.override.yml on the box, not committed — see deploy/vietdataverse.caddy
# for the routing rules it uses). Secrets renamed HETZNER_* -> DEPLOY_* accordingly.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Generate Static Chart Data"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if server secrets not configured
        id: guard
        run: echo "ready=${{ secrets.DEPLOY_HOST != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            git fetch --quiet origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            echo "Deployed $(git rev-parse --short HEAD)"
