name: Weekly Data Quality Check

on:
  schedule:
    # Mondays 09:17 VN (02:17 UTC), after the morning crawlers have finished.
    #
    # Weekly, not daily (2026-09-14): the report now includes the retrospective
    # SJC reconciliation, which makes one HTTP request per audited day against
    # someone else's archive — not something to run daily. A weekly cadence also
    # matches how often anyone actually reads it.
    #
    # :17, not :00 — see CLAUDE.md: GitHub drops and delays scheduled runs on
    # round minutes, and this workflow sat on ':00' the whole time.
    - cron: '17 2 * * 1'
  workflow_dispatch:

jobs:
  data-quality-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r crawl_tools/requirements.txt

    - name: Run data quality check
      env:
        CRAWLING_BOT_DB:     ${{ secrets.CRAWLING_BOT_DB }}
        CRAWLING_CORP_DB:    ${{ secrets.CRAWLING_CORP_DB }}
        GLOBAL_INDICATOR_DB: ${{ secrets.GLOBAL_INDICATOR_DB }}
        USER_DB:             ${{ secrets.USER_DB }}
        SMTP_USER:           ${{ secrets.SMTP_USER }}
        SMTP_PASS:           ${{ secrets.SMTP_PASS }}
      run: python crawl_tools/data_quality_check.py

    - name: Show status
      if: always()
      run: echo "Data quality check completed at $(date)"
