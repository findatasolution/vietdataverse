name: Gold & Silver Price Crawl (2-hourly, VN office hours)

on:
  schedule:
    # Minute 07, not :00/:30 — GitHub's scheduler is most congested on the round
    # minutes, and scheduled runs there are queued at low priority or dropped
    # outright. Measured 2026-08-09 on the old '30 …' schedule: the 01:30 UTC slot
    # never fired at all (first run of the day landed 03:04–04:38 UTC), only 4–8
    # of the 9 declared runs materialised, and the ones that did started 32 min
    # late on average (max 58). See deploy/crawl-fallback.sh for the box-side net.
    # Every 2 hours across VN office hours: 08:07, 10:07, 12:07, 14:07, 16:07 VN
    # (01:07, 03:07, 05:07, 07:07, 09:07 UTC). Each run upserts today's row rather
    # than skipping it (see crawl_gold_silver.py's 2026-09-12 note), so the stored
    # price tracks intraday moves instead of freezing at the opening quote. Was
    # hourly (9 runs) until 2026-09-12; SJC adjusts a handful of times a day, so
    # 2-hourly captures the moves without 9 crawls of mostly-identical data.
    - cron: '7 1,3,5,7,9 * * *'
  workflow_dispatch: {}

jobs:
  crawl-gold-silver:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r crawl_tools/requirements.txt

    - name: Run gold & silver crawler
      env:
        CRAWLING_BOT_DB: ${{ secrets.CRAWLING_BOT_DB }}
        GLOBAL_INDICATOR_DB: ${{ secrets.GLOBAL_INDICATOR_DB }}
        HELPER_DB: ${{ secrets.HELPER_DB }}
      run: |
        cd crawl_tools
        python crawl_gold_silver.py

    - name: Trigger webhooks (gold + silver)
      env:
        WEBHOOK_INTERNAL_SECRET: ${{ secrets.WEBHOOK_INTERNAL_SECRET }}
        API_BASE: https://api.vietdataverse.online
      run: |
        if [ -z "$WEBHOOK_INTERNAL_SECRET" ]; then
          echo "Webhook delivery disabled: WEBHOOK_INTERNAL_SECRET is not configured"
          exit 0
        fi
        for event in gold silver; do
          curl -sf -X POST "${API_BASE}/api/v1/internal/webhooks/trigger" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Secret: ${WEBHOOK_INTERNAL_SECRET}" \
            -d "{\"event\": \"${event}\", \"data\": []}" \
            && echo "✅ Webhook trigger: ${event}" \
            || echo "⚠️ Webhook trigger failed for ${event} (non-critical)"
        done
