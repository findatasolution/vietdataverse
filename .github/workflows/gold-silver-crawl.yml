name: Gold & Silver Price Crawl (2-hourly, VN office hours)

# MANUAL ONLY — the scheduled crawl runs on the prod box, not here (2026-09-14).
#
# This workflow had a schedule until 2026-09-14. It was removed not because the
# code is wrong, but because GitHub is the wrong place to run it:
#   - Network: the 2026-09-13 run failed with a connect timeout to
#     www.24h.com.vn. GitHub's runners sit outside Vietnam; nso.gov.vn refuses
#     such IPs outright, which is why prod itself moved to a VN box on
#     2026-09-04. The box reaches these sources without trouble.
#   - Scheduling: GitHub dropped every slot on 2026-09-14, and measured
#     2026-08-09 it fired only 4-8 of 9 declared daily runs, 32 min late on
#     average. systemd on the box fires on time.
#
# The box now runs this every 2 hours across VN office hours — see
# deploy/crawl-fallback.timer and deploy/crawl-fallback.sh. Keeping a schedule
# here as well would mean two writers racing on the same rows for no benefit.
#
# Use the manual trigger below when the box is down and the day's data must land.
on:
  workflow_dispatch: {}

jobs:
  crawl-gold-silver:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r crawl_tools/requirements.txt

    - name: Run gold & silver crawler
      env:
        CRAWLING_BOT_DB: ${{ secrets.CRAWLING_BOT_DB }}
        GLOBAL_INDICATOR_DB: ${{ secrets.GLOBAL_INDICATOR_DB }}
        HELPER_DB: ${{ secrets.HELPER_DB }}
      run: |
        cd crawl_tools
        python crawl_gold_silver.py

    - name: Trigger webhooks (gold + silver)
      env:
        WEBHOOK_INTERNAL_SECRET: ${{ secrets.WEBHOOK_INTERNAL_SECRET }}
        API_BASE: https://api.vietdataverse.online
      run: |
        if [ -z "$WEBHOOK_INTERNAL_SECRET" ]; then
          echo "Webhook delivery disabled: WEBHOOK_INTERNAL_SECRET is not configured"
          exit 0
        fi
        for event in gold silver; do
          curl -sf -X POST "${API_BASE}/api/v1/internal/webhooks/trigger" \
            -H "Content-Type: application/json" \
            -H "X-Internal-Secret: ${WEBHOOK_INTERNAL_SECRET}" \
            -d "{\"event\": \"${event}\", \"data\": []}" \
            && echo "✅ Webhook trigger: ${event}" \
            || echo "⚠️ Webhook trigger failed for ${event} (non-critical)"
        done
